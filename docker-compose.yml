services:
  postgres:
    image: postgres:16-alpine
    container_name: ads-ai-agent-postgres
    restart: unless-stopped
    ports:
      - "5445:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ads_ai_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ads_ai_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
